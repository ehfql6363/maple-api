name: 일일 스펙 수집

on:
  schedule:
    # 매일 03:17 KST (18:17 UTC). 전날 데이터가 확정된 뒤에 돈다.
    - cron: "17 18 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
          RANKING_PAGES: ${{ vars.RANKING_PAGES || '5' }}
          MAX_CHARACTERS: ${{ vars.MAX_CHARACTERS || '500' }}
